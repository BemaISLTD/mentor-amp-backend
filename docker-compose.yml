version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mentor_amp_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mentor_amp
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: mentor_amp_api
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg2://user:password@db:5432/mentor_amp
      - APP_NAME=MentorAmp
      - DEBUG=true
      - JWT_SECRET_KEY=development-only-change-me-at-least-32-bytes
      - ARTIFACT_STORAGE_BACKEND=local
      - ARTIFACT_STORAGE_PATH=/app/artifacts
      - CODE_VERSION=development
    volumes:
      # Mount the local backend folder to /app for hot-reloading
      - ./backend:/app

volumes:
  postgres_data:
